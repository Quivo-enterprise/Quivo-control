services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: quivo
      POSTGRES_PASSWORD: quivo_dev
      POSTGRES_DB: quivo_control
    ports:
      # host 5434 -> evita choque con otros Postgres locales en 5432/5433 en esta máquina de desarrollo
      - '5434:5432'
    volumes:
      - quivo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quivo -d quivo_control']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Puerto host 6380 (no el 6379 default) — mismo motivo que el 5434 de postgres arriba:
    # evitar el choque con otro Redis local en esta máquina de desarrollo (QUI-234).
    ports:
      - '6380:6379'
    volumes:
      - quivo_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Motor de ruteo self-hosted (calles reales de Bolivia, sin API key ni servicio de
  # terceros). Necesita el mapa vial procesado antes: `bash scripts/setup-osrm.sh`.
  osrm:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld --max-table-size 8000 /data/bolivia-latest.osrm
    ports:
      - '5001:5000'
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped

volumes:
  quivo_postgres_data:
  quivo_redis_data:
