services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: quivo
      POSTGRES_PASSWORD: quivo_dev
      POSTGRES_DB: quivo_control
    ports:
      # host 5444 -> copia sandbox, offset +10 sobre el 5434 del stack original de
      # Quivo-control, para que ambos stacks puedan correr a la vez sin chocar
      - '5444:5432'
    volumes:
      - quivo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quivo -d quivo_control']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Puerto host 6390 (no el 6379 default) — copia sandbox, offset +10 sobre el 6380
    # del stack original de Quivo-control, para que ambos stacks puedan correr a la vez
    # sin chocar (QUI-234).
    ports:
      - '6390:6379'
    volumes:
      - quivo_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Motor de ruteo self-hosted (calles reales de Bolivia, sin API key ni servicio de
  # terceros). Necesita el mapa vial procesado antes: `bash scripts/setup-osrm.sh`.
  osrm:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld --max-table-size 8000 /data/bolivia-latest.osrm
    # Puerto host 5011 — copia sandbox, offset +10 sobre el 5001 del stack original de
    # Quivo-control, para que ambos stacks puedan correr a la vez sin chocar
    ports:
      - '5011:5000'
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped

volumes:
  quivo_postgres_data:
  quivo_redis_data:
