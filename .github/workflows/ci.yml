name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: quivo
          POSTGRES_PASSWORD: quivo_dev
          POSTGRES_DB: quivo_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quivo -d quivo_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://quivo:quivo_dev@localhost:5432/quivo_control
      RUNTIME_DATABASE_URL: postgresql://quivo_app:quivo_app_dev@localhost:5432/quivo_control
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-never-use-in-production-000000
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      BETTER_AUTH_URL: http://localhost:3001
      # Fuera de development, packages/db/prisma/seed.ts exige estas tres explícitas y aborta
      # si faltan (ver resolveSeedSecret() ahí) — CI corre NODE_ENV=test, así que sin esto el
      # paso "Seed database" fallaría. Mismos valores que el default de development: varios
      # *.test.ts los hardcodean para loguear contra el seed (ver auth.service.test.ts).
      SEED_ADMIN_PASSWORD: Quivo123!
      MOBILE_SEED_VEHICLE_PIN: "246810"
      MOBILE_SEED_DRIVER_PIN: "135790"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm --filter @quivo/db prisma:migrate:deploy

      # Varios tests (auth.service.test.ts, jwt-auth.guard.integration.test.ts) corren
      # contra Better-Auth real usando los usuarios seed (admin@quivo.local,
      # admin@sindicato.local) en vez de mockear `auth.api.*`. `prisma:migrate:deploy`
      # deja la base migrada pero vacía, así que sin este paso esos tests fallan con 401
      # en CI aunque pasen en local (donde la base de desarrollo ya tiene el seed
      # aplicado). El cliente de Prisma en sí ya está garantizado en este punto: el
      # `postinstall` de `packages/db/package.json` corre `prisma generate` en todo
      # `pnpm install` (el paso "Install dependencies" de arriba), sin depender del orden
      # de los pasos ni de si `@quivo/db:build` da *cache hit* en Turbo — un cache hit de
      # Turbo restaura solo los `outputs` declarados (`dist/**`, turbo.json) y NO
      # reejecuta el comando, así que si dependiéramos de eso, `prisma generate` no
      # correría y el cliente nunca se escribiría en `node_modules` (así fallaba antes:
      # ver el commit que agregó este `postinstall`). El `prisma generate` explícito que
      # sigue teniendo `prisma:seed` (packages/db/package.json) es ahora redundante con el
      # `postinstall`, pero se deja como red de seguridad barata para quien corra el seed
      # sin haber pasado por un `pnpm install` fresco — ver el comentario en
      # prisma/seed.ts.
      - name: Seed database
        run: pnpm --filter @quivo/db prisma:seed

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # CI nunca ejecutaba Metro (ni `expo export`): el `build` de arriba es sólo `tsc --noEmit`
      # en `apps/mobile` (ver su `package.json`), así que un bundle roto —dos copias de React o
      # de React Native mezcladas por un hoist de pnpm ambiguo— podía mergearse con CI en verde
      # y recién se detectaba al instalar el APK real y verlo crashear al abrir. Estos dos pasos
      # arman el bundle de verdad (con sourcemap) y lo auditan contra ese bug de vuelta.
      - name: Exportar bundle de apps/mobile (con sourcemap)
        run: pnpm --filter @quivo/mobile exec expo export --platform android --dump-sourcemap --output-dir /tmp/mobile-dist

      - name: Verificar que el bundle no lleve paquetes duplicados
        run: node scripts/assert-bundle-singletons.mjs /tmp/mobile-dist

  acceptance:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: quivo
          POSTGRES_PASSWORD: quivo_dev
          POSTGRES_DB: quivo_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quivo -d quivo_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://quivo:quivo_dev@localhost:5432/quivo_control
      RUNTIME_DATABASE_URL: postgresql://quivo_app:quivo_app_dev@localhost:5432/quivo_control
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-never-use-in-production-000000
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      BETTER_AUTH_URL: http://localhost:3001
      # Fuera de development, packages/db/prisma/seed.ts exige estas tres explícitas y aborta
      # si faltan (ver resolveSeedSecret() ahí) — CI corre NODE_ENV=test, así que sin esto el
      # paso "Seed acceptance data" fallaría. Mismos valores que el default de development:
      # tests/acceptance/*.spec.ts y varios *.test.ts los hardcodean para loguear contra el
      # seed (ver admin-panel.spec.ts, auth.service.test.ts).
      SEED_ADMIN_PASSWORD: Quivo123!
      MOBILE_SEED_VEHICLE_PIN: "246810"
      MOBILE_SEED_DRIVER_PIN: "135790"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `test:acceptance` corre `playwright test` directo (no es una tarea de turbo, no
      # pasa por el grafo de dependencias de turbo.json) y su `webServer` levanta
      # `@quivo/api` (build + start) y `@quivo/web` (`next dev`) por su cuenta. Ambos
      # resuelven `@quivo/db`, `@quivo/shared` y `@quivo/design-system` como paquetes de
      # workspace ya compilados (`dist/`), así que hay que compilarlos antes. Ojo: este
      # build (`@quivo/db`: `prisma generate && tsc`) puede dar *cache hit* en Turbo, y un
      # cache hit no reejecuta `prisma generate` (solo restaura `dist/**`, el output
      # declarado en turbo.json) — pero eso ya no es un problema real: el cliente de
      # Prisma queda garantizado por el `postinstall` de `packages/db/package.json`, que
      # corre `prisma generate` en "Install dependencies" (arriba), antes de que Turbo
      # tenga la chance de dar cache hit. `"Seed acceptance data"` sigue corriendo su
      # propio `prisma generate` (vía `prisma:seed`, ver prisma/seed.ts) como red de
      # seguridad redundante, no como la garantía principal. Se excluye `@quivo/web` de
      # este build a propósito:
      # lo levanta `next dev`, que compila sobre la marcha y no necesita un build de
      # producción previo — incluirlo acá solo alargaría este paso sin aportar nada (su
      # `next build` de producción ya se verifica aparte en el job `ci`, que corre `pnpm
      # build` sin filtro y es una dependencia de este job).
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@quivo/db --filter=@quivo/shared --filter=@quivo/design-system

      - name: Migrate database
        run: pnpm --filter @quivo/db prisma:migrate:deploy

      - name: Seed acceptance data
        run: pnpm --filter @quivo/db prisma:seed

      - name: Run acceptance tests
        run: pnpm test:acceptance

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
